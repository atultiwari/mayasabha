<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#14121f">
  <title>Projector Remote</title>
  <style>
    :root { color-scheme: dark; --bg: #14121f; --card: #24203a; --ink: #f4f1ff; --muted: #9a93c0; --accent: #ffcc4d; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font: 600 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; }
    #status { font-size: 13px; color: var(--muted); }
    #status.connected { color: #7be08a; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
    button { border: 0; border-radius: 18px; background: var(--card); color: var(--ink); padding: 14px 6px;
      display: flex; flex-direction: column; align-items: center; gap: 6px; font: inherit; font-size: 14px;
      touch-action: manipulation; user-select: none; transition: transform 80ms ease, background 120ms; }
    button .icon { font-size: 40px; line-height: 1; }
    button:active, button.flash { transform: scale(0.94); background: #3a3360; }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <header><h1 id="title">Projector Remote</h1><span id="status">connecting…</span></header>
  <main id="grid"><p class="empty">Open an activity on the projector computer. Its buttons will appear here.</p></main>
  <script type="module" src="./remote.js"></script>
</body>
</html>
